# Starts a long download (Big Buck Bunny, about 720 MB of video) for the pause and relaunch flows.
# The flows act on it while it downloads; on the simulator its AV1 video can't be prepared afterwards,
# so they stop it before it finishes. Point taps are for an iPhone 17 (iOS 27.2) simulator.
steps:
  - echo: Clear the queue and library, then start yoink'd fresh on the empty Library
  - script: { path: checks/reset.mjs }
  - launch: com.maynkudu.iyoinks
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "No saved media" }, timeoutMs: 20000 }
  - echo: Fill in the yoink! sheet with Big Buck Bunny through yoinkd://add (kind=video)
  - tool: open-url
    args: { url: "yoinkd://add?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3Daqz-KE-bpKQ&kind=video" }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Check link", role: Button }, timeoutMs: 10000 }
  - echo: Tapping 'Check link' (about 0.81, 0.26) once the sheet settles
  - tool: gesture-tap
    args: { x: 0.812, y: 0.264 }
    delayMs: 800
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Download size" }, timeoutMs: 60000 }
  - echo: Scrolling to the sheet's yoink! and tapping it (about 0.86, 0.91)
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.75, toX: 0.5, toY: 0.35, momentum: false }
  - echo: A second swipe pins the sheet to its bottom, so the yoink! button is always at the same spot
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.75, toX: 0.5, toY: 0.35, momentum: false }
  - tool: await-ui-element
    args: { condition: visible, selector: { text: "Some source formats need conversion" }, timeoutMs: 5000 }
  - tool: gesture-tap
    args: { x: 0.859, y: 0.913 }
    delayMs: 800
  - echo: yoinkctl waits until bytes arrive, so the row shows its progress layout
  - script: { path: checks/newest-receiving.mjs, timeout: 90000 }
